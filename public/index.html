<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DittoGames — play together, anywhere</title>
<meta name="description" content="DittoGames: free browser games. Play Snake, Super Tic Tac Toe, Connect Four and more — solo or online with a friend using a room code.">
<meta name="theme-color" content="#7c3aed">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('dittogames:theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="app-shell">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="#/">
        <svg class="brand__logo" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="url(#logoGrad)"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8b5cf6"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <circle cx="22" cy="24" r="5.5" fill="#fff"/>
          <circle cx="42" cy="24" r="5.5" fill="#fff"/>
          <circle cx="22" cy="42" r="5.5" fill="#fff"/>
          <circle cx="42" cy="42" r="5.5" fill="#fff"/>
          <circle cx="32" cy="33" r="5.5" fill="#fff"/>
        </svg>
        <span class="brand__name">Ditto<span class="brand__name-accent">Games</span></span>
      </a>
      <nav class="site-header__nav">
        <a href="#/" class="nav-link">All games</a>
        <a href="#/polls" class="nav-link">Polls</a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5V2m0 20v-2.5M4.5 12H2m20 0h-2.5M6.3 6.3 4.6 4.6m14.8 14.8-1.7-1.7M6.3 17.7l-1.7 1.7M19.4 4.6l-1.7 1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/></svg>
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="view" class="view container" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>DittoGames — free browser games, no sign-up. Play solo or send a friend a room code.</p>
    </div>
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
